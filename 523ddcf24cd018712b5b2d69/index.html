<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CF NJ Sales Board</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header id="hdr">
  <div class="brand"><span class="logo">CF</span><div><h1>NJ Sales Board</h1><div class="sub" id="sub">Loading…</div></div></div>
  <nav id="nav"></nav>
  <div class="ctl"><span id="stale" class="badge hidden"></span><button id="btnDef" title="Definitions and data limits">Definitions</button><button id="btnTv" title="TV mode">TV</button><button id="btnRef" title="Refresh">↻</button></div>
  <div id="winbar"></div>
</header>
<main id="main"></main>
<div id="tvbar" class="hidden"><div id="tvprog"></div></div>
<aside id="drawer" class="hidden"><div class="dr-in"><button id="drClose" class="x">✕</button><div id="drBody"></div></div></aside>
<div id="lock" class="overlay hidden">
  <form id="lockform"><h2>Access code</h2><p>Enter the shared access code to view the Sales Board.</p>
  <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="access code">
  <button type="submit">Unlock</button><div id="lockerr" class="err"></div></form>
</div>
<script src="app.js"></script>
</body></html>
